name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[custody]"
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Run engineering tests
        run: python -m unittest discover -s tests -v

  engineering-contracts:
    name: Contract, source-boundary and wheel checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and pinned engineering tools
        run: |
          python -m pip install -e ".[custody]"
          python -m pip install setuptools==80.9.0 ruff==0.14.6 build==1.2.2
      - name: Correctness lint over ALL legacy source, tests and scripts
        run: ruff check --select E9,F821,F822,F823 src tests scripts
      - name: Lint changed engineering contract surface
        run: |
          ruff check --select E4,E7,E9,F \
            src/swing_trading/engineering_contracts.py \
            src/swing_trading/engineering_release.py \
            tests/test_engineering_module_contracts.py \
            tests/test_engineering_release.py \
            src/swing_trading/d1_mcp_transport_bridge.py \
            src/swing_trading/backtest.py \
            src/swing_trading/partition_chunk_cache.py \
            src/swing_trading/segmented_cache.py \
            tests/test_h2_legacy_ports.py \
            src/swing_trading/cache_swap_preview.py \
            tests/test_h2_cache_swap.py \
            scripts/h2_architecture_audit.py \
            tests/test_h2_architecture_audit.py \
            scripts/h3_deep_module_review.py \
            tests/test_h3_deep_module_review.py
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Audit all legacy package modules and dependency boundaries
        run: python scripts/h2_architecture_audit.py --check --json-out /tmp/st18-h2-inventory.json
      - name: Save complete module inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: h2-architecture-inventory
          path: /tmp/st18-h2-inventory.json
          retention-days: 14
      - name: Deep review of all source modules (offline H3)
        run: python -m scripts.h3_deep_module_review --check --json-out /tmp/st18-h3-review.json --matrix-out /tmp/st18-h3-matrix.md
      - name: Ensure committed H3 matrix matches regenerated all-module report
        run: diff -u docs/H3_MODULE_DISPOSITION_PROVISIONAL.md /tmp/st18-h3-matrix.md
      - name: Emit full H3 module matrix for permanent review
        run: cat /tmp/st18-h3-matrix.md
      - name: Preserve H3 module-by-module review evidence
        uses: actions/upload-artifact@v4
        with:
          name: h3-deep-legacy-review
          path: |
            /tmp/st18-h3-review.json
            /tmp/st18-h3-matrix.md
          retention-days: 14
      - name: Run substitution and compatibility contracts
        run: python -m unittest discover -s tests -p "test_engineering_*.py" -v
      - name: Build distribution wheel
        run: python -m build --wheel --no-isolation --outdir dist
      - name: Smoke-test isolated wheel installation
        run: |
          python -m venv /tmp/st18-contract-wheel
          /tmp/st18-contract-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/st18-contract-wheel/bin/python -c "import swing_trading; from swing_trading.engineering_contracts import PortDescriptor; from swing_trading.engineering_release import EngineeringSnapshot; assert swing_trading.__version__ == '0.0.1'"
